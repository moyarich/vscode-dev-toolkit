name: Release

run-name: >-
  Release · ${{ inputs.package }} · dry-run=${{ inputs.dry-run }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package selector
        required: true
        default: "."
        type: string
      version-mode:
        description: Version mode
        required: true
        default: bump
        type: choice
        options:
          - bump
          - package-json
          - exact
      version-bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      exact-version:
        description: Exact version when version-mode is exact
        required: false
        default: ""
        type: string
      dry-run:
        description: Dry-run — Preview without repository or registry mutation
        required: true
        default: true
        type: boolean

permissions: {}

jobs:
  validate-release-ref:
    name: Validate release branch
    runs-on: ubuntu-latest
    steps:
      - name: Require main for a real release
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$DRY_RUN" == "false" && "$TARGET_BRANCH" != "main" ]]; then
            echo "::error::Real releases must run from main."
            exit 1
          fi

  dispatch-input-summary:
    name: "job: Workflow parameters"
    permissions:
      contents: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_dispatch-input-summary.yml@main
    with:
      parameters-json: ${{ toJSON(inputs) }}
      heading: "release · Dispatch parameters"

  release:
    needs: [validate-release-ref, dispatch-input-summary]
    permissions:
      contents: write
      packages: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_npm-release.yml@main
    with:
      show-input-summary: false
      target-branch: ${{ github.ref_name }}
      package: ${{ inputs.package }}
      version-mode: ${{ inputs.version-mode }}
      version-bump: ${{ inputs.version-bump }}
      exact-version: ${{ inputs.exact-version }}
      dry-run: ${{ inputs.dry-run }}
      node-version: "24"
      workspace-tools-source: checkout:current
